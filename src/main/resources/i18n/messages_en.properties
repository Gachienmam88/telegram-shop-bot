guide.text=📘 <b>How to use</b>\n\n1️⃣ Tap <b>Products</b> → choose a category → choose a product.\n2️⃣ Enter the quantity.\n3️⃣ Pay with your wallet balance or scan the bank transfer QR code.\n4️⃣ Once paid, the bot sends your accounts automatically.\n\n⏰ Bank transfer orders are cancelled after {0} minutes if unpaid.\n📜 See your purchased accounts again in <b>Purchase history</b>.
warranty.text=🛡️ <b>Warranty policy</b>\n\n• Warranty period follows each product description.\n• If an account has problems, contact support with your <b>order code</b>.\n• No warranty if you change account details, violate the service terms or do not follow instructions.
