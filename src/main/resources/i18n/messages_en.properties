sell.intro=📤 <b>We buy TikTok Shop accounts</b>\n\nRequirements:\n• Over 1,000 followers\n• Has a shop (TikTok Shop)\n• Has Live Studio\n\nYou will enter:\n1️⃣ Login email or phone number\n2️⃣ Account username (e.g. @yourshop)\n3️⃣ Your asking price (VND)\n\n🔒 The bot does NOT ask for your password. An admin verifies and does an official transfer before paying.\n\nTap Start to submit.
