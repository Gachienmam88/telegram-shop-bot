sell.admin_notify=📤 <b>TIKTOK ACCOUNT SUBMISSION</b>\nRef: <code>{0}</code>\n👤 User: <code>{1}</code>\n📧 Login: <code>{2}</code>\n🔖 Username: <code>{3}</code>\n💰 Asking price: <b>{4}</b>\n\nReview, then tap Approve (credit wallet) or Reject.
